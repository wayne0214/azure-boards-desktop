[package]
name = "azure-boards-desktop"
version = "1.4.0-alpha.4"
description = "A desktop client for Azure DevOps Boards"
authors = ["Jia Hao Lai"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "azure_boards_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
csv = "1"
thiserror = "2"
urlencoding = "2"
futures = "0.3"
arboard = { version = "3", default-features = false, features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri-plugin-notification = "2"
# MCP server (src/mcp); remove these with that folder (png encodes clipboard screenshots).
tiny_http = "0.12"
getrandom = "0.2"
png = "0.18"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Lets notifications show as banners while Boards is in front (src/notify_banner.rs).
objc2 = "0.6"
