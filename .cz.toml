[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version = "1.1.0"
major_version_zero = false
# git-tools keeps these in step on every bump: package.json, package-lock.json,
# src-tauri/Cargo.toml and src-tauri/Cargo.lock. tauri.conf.json reads ../package.json.
auxiliary_directories = [".", "src-tauri"]
